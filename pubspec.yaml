name: novel_reader
description: My Novel Reader App
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ^3.41.0

dependencies:
  auto_route: ^11.1.0
  bloc: ^9.2.0
  dio: ^5.6.0
  equatable: ^2.0.5
  firebase_core: ^4.5.0
  firebase_crashlytics: ^5.0.8
  flowery_tts:
    git:
      url: https://github.com/Kuroketsu/flowery-tts.git
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.0.2
  http: ^1.2.2
  intl: ^0.20.2
  path_provider: ^2.1.4
  search_highlight_text: ^1.0.0+2
  shared_preferences: ^2.3.2
  toastification: ^3.0.3

dependency_overrides:
  uuid: ^4.5.3

dev_dependencies:
  auto_route_generator: ^10.0.1
  bloc_lint: ^0.3.7
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.22
  build_runner: ^2.4.12
  flutter_gen_runner: ^5.6.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.2.0

flutter_gen:
  colors:
    inputs:
      - assets/colors/colors.xml

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/google_fonts/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/google_fonts/Roboto-Regular.ttf
        - asset: assets/google_fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/google_fonts/Roboto-Black.ttf
          weight: 900
